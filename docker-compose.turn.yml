# Optional TURN/TLS transport. matrix-init requires matching trusted certificate/key
# inputs (KY_MATRIX_TURN_*). Preserve the existing COMPOSE_FILE overlay chain.
services:
  livekit:
    ports:
      - "${KY_MATRIX_MEDIA_BIND_IP:?set KY_MATRIX_MEDIA_BIND_IP to the host address for call media, or 0.0.0.0 for every interface}:3478:3478/udp"
      - "${KY_MATRIX_MEDIA_BIND_IP:?set KY_MATRIX_MEDIA_BIND_IP to the host address for call media, or 0.0.0.0 for every interface}:443:5349/tcp"
      - "${KY_MATRIX_MEDIA_BIND_IP:?set KY_MATRIX_MEDIA_BIND_IP to the host address for call media, or 0.0.0.0 for every interface}:30000-30100:30000-30100/udp"
