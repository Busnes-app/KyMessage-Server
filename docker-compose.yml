# Local operator-console preview. No chat client is embedded.
services:
  app:
    # The published, attested release image. `docker compose pull` moves to the newest release;
    # `up` uses what is present, otherwise pulls. A source build lives in docker-compose.build.yml
    # under kymessages:local, which wins over this.
    # To run one release only, pin it by digest after verifying it was built by this repository's
    # release workflow at that tag (gh logged in). The new .env is staged here and renamed over
    # the old one only after a full write, so a failed check never touches your secrets:
    #   v=0.4.2; i=ghcr.io/busnes-app/kymessage-server \
    #     && d=$(docker buildx imagetools inspect "$i:$v" --format '{{.Manifest.Digest}}') \
    #     && gh attestation verify "oci://$i@$d" --repo Busnes-app/KyMessage-Server \
    #          --cert-identity "https://github.com/Busnes-app/KyMessage-Server/.github/workflows/release-image.yml@refs/tags/v$v" \
    #     && (umask 077; t=$(mktemp ./.env.XXXXXX) && touch .env && { grep -v '^KY_IMAGE=' .env || [ $? -eq 1 ]; } > "$t" \
    #         && echo "KY_IMAGE=$i@$d" >> "$t" && mv "$t" .env) \
    #     && grep -qxF "KY_IMAGE=$i@$d" .env
    image: ${KY_IMAGE:-ghcr.io/busnes-app/kymessage-server:stable}
    pull_policy: missing
    container_name: kymessages
    restart: unless-stopped
    # Never root: the owner of ./data and ./backups (create both as that user before `up`).
    # The Matrix overlay replaces it with KY_MATRIX_UID:KY_MATRIX_GID, which must own them too.
    user: "${KY_UID:?Set KY_UID and KY_GID to the owner of ./data and ./backups (id -u, id -g)}:${KY_GID:?Set KY_GID (id -g)}"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    # Covers the 5s HTTP drain and the 20m in-flight backup shutdown budget.
    stop_grace_period: 21m
    ports:
      - "${KY_BIND:-127.0.0.1}:8080:8080"
    environment:
      - KY_PORT=8080
      - KY_HOST=0.0.0.0
      - KY_ENV=${KY_ENV:-development}
      - KY_APP_NAME=${KY_APP_NAME:-KyMessages}
      - KY_APP_URL=${KY_APP_URL:-http://localhost:8080}
      - KY_ADMIN_USERNAME=${KY_ADMIN_USERNAME:-admin}
      - KY_ADMIN_PASSWORD=${KY_ADMIN_PASSWORD:?Set a bootstrap operator password}
      - KY_SESSION_SECRET=${KY_SESSION_SECRET:-}
      - KY_DB_DRIVER=sqlite
      - KY_DATA_DIR=/app/data
      - KY_BACKUP_DIR=${KY_BACKUP_DIR-/app/backups}
      - KY_BACKUP_KEEP=${KY_BACKUP_KEEP:-7}
      - KY_BACKUP_DEPOSIT_INTERVAL=${KY_BACKUP_DEPOSIT_INTERVAL:-24h}
      - KY_BACKUP_ALLOW_PRIVATE_RECOVERY=${KY_BACKUP_ALLOW_PRIVATE_RECOVERY:-false}
      - KY_TRUSTED_PROXIES=${KY_TRUSTED_PROXIES:-}
      - KY_SSO_ENABLED=true
      - KY_KYIDENTITY_ISSUER=${KY_KYIDENTITY_ISSUER:-}
      - KY_KYIDENTITY_CLIENT_ID=${KY_KYIDENTITY_CLIENT_ID:-}
      - KY_KYIDENTITY_SECRET=${KY_KYIDENTITY_SECRET:-}
      - KY_KYIDENTITY_HMAC_SECRET=${KY_KYIDENTITY_HMAC_SECRET:-}
      - KY_SCIM_ENABLED=true
      - KY_SCIM_TOKEN=${KY_SCIM_TOKEN:-}
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
