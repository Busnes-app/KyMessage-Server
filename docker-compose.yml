# Local operator-console preview. No chat client is embedded.
# Build this checkout with docker-compose.build.yml; no KyMessages image is published yet.
services:
  app:
    image: ${KY_IMAGE:-kymessages:local}
    pull_policy: never
    container_name: kymessages
    restart: unless-stopped
    # Covers the 5s HTTP drain and the 20m in-flight backup shutdown budget.
    stop_grace_period: 21m
    ports:
      - "${KY_BIND:-127.0.0.1}:8080:8080"
    environment:
      - KY_PORT=8080
      - KY_HOST=0.0.0.0
      - KY_ENV=${KY_ENV:-development}
      - KY_APP_NAME=${KY_APP_NAME:-KyMessages}
      - KY_APP_URL=${KY_APP_URL:-http://localhost:8080}
      - KY_ADMIN_PASSWORD=${KY_ADMIN_PASSWORD:?Set a bootstrap operator password}
      - KY_SESSION_SECRET=${KY_SESSION_SECRET:-}
      - KY_DB_DRIVER=sqlite
      - KY_DATA_DIR=/app/data
      - KY_BACKUP_DIR=${KY_BACKUP_DIR-/app/backups}
      - KY_BACKUP_KEEP=${KY_BACKUP_KEEP:-7}
      - KY_BACKUP_DEPOSIT_INTERVAL=${KY_BACKUP_DEPOSIT_INTERVAL:-24h}
      - KY_BACKUP_ALLOW_PRIVATE_RECOVERY=${KY_BACKUP_ALLOW_PRIVATE_RECOVERY:-false}
      - KY_TRUSTED_PROXIES=${KY_TRUSTED_PROXIES:-}
      - KY_SSO_ENABLED=true
      - KY_KYIDENTITY_ISSUER=${KY_KYIDENTITY_ISSUER:-}
      - KY_KYIDENTITY_CLIENT_ID=${KY_KYIDENTITY_CLIENT_ID:-}
      - KY_KYIDENTITY_SECRET=${KY_KYIDENTITY_SECRET:-}
      - KY_KYIDENTITY_HMAC_SECRET=${KY_KYIDENTITY_HMAC_SECRET:-}
      - KY_SCIM_ENABLED=true
      - KY_SCIM_TOKEN=${KY_SCIM_TOKEN:-}
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
