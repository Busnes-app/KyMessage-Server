# Acceptance harness only (scripts/matrix-acceptance.sh); never part of a deployment. Runs
# KyMessages itself, built from this checkout, for the offboarding sweep, the directory
# webhook and server backups. It reaches MAS's admin API exactly as shipped
# (docker-compose.matrix.yml); only the deployment knobs that would leave the project are reset.
services:
  app:
    image: ${KYMATRIX_ACCEPT_APP_IMAGE:?}
    # A fixed name would collide with a real KyMessages container on this host.
    container_name: !reset null
    # Only the harness proxy publishes a port.
    ports: !reset []
    # Harness login without proof-of-work; never in a deployment.
    environment:
      KY_CAPTCHA_PROVIDER: none
    # Mounts, user and hardening exactly as shipped: ./data and ./backups resolve under the
    # scratch project directory, made by the harness as KY_MATRIX_UID.

  # Its shipped ./data, ./backups and ./matrix binds resolve under the scratch project
  # directory, which the harness fills with user-owned files.
  restore-matrix:
    image: ${KYMATRIX_ACCEPT_APP_IMAGE:?}
