# Acceptance harness only (scripts/matrix-acceptance.sh); never part of a deployment. Applied
# on top of docker-compose.yml + docker-compose.matrix.yml with the scratch directory as the
# project directory, so ./matrix is the harness's own matrix-init output.
# Loopback without weakening the shipped configs: a TLS proxy with a throwaway CA answers for
# the https hosts (network aliases inside, 127.0.0.1:<ephemeral> outside). MAS and
# KyIdentity trust only that CA; the harness imports its throwaway CA into Chromium temporarily.
services:
  kyidentity:
    image: ${KYMATRIX_ACCEPT_KYID_IMAGE:?}
    pull_policy: never
    environment:
      KYIDENTITY_ISSUER_URL: https://id.kymatrix.test
      KYIDENTITY_DATA_DIR: /data
      BOOTSTRAP_ADMIN_USER: admin
      BOOTSTRAP_ADMIN_PASS: ${KYMATRIX_ACCEPT_ADMIN_PASS:?}
      # Back-channel logout to MAS and the directory webhook to KyMessages both resolve to
      # the harness proxy's address on the project network.
      KYIDENTITY_ALLOW_PRIVATE_CALLBACKS: "true"
    # As the harness user on a scratch bind, so the kyidentity step can mark test emails
    # verified in its database (no mail server here; KyIdentity verifies by mailed link).
    user: "${KY_MATRIX_UID:?}:${KY_MATRIX_GID:?}"
    volumes:
      - ./kyidentity-data:/data
      - ./tls/ca.crt:/etc/ssl/certs/ca-certificates.crt:ro

  tls:
    image: nginx:1.29.1-alpine@sha256:42a516af16b852e33b7682d5ef8acbd5d13fe08fecadc7ed98605ba5e3b26ab8
    ports:
      - "127.0.0.1::443"
    volumes:
      - ./overrides/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls:/etc/nginx/tls:ro
      # Empty until the reproduction step drops the compat routing in.
      - ./nginx-extra:/etc/nginx/kymatrix-extra:ro
    networks:
      default:
        aliases: [kymatrix.test, id.kymatrix.test, auth.kymatrix.test, matrix.kymatrix.test, chat.kymatrix.test, admin.kymatrix.test, sfu.kymatrix.test, peer.kymatrix.test]
    # Only KyIdentity: the client is registered there before MAS has a config.
    depends_on: [kyidentity]

  livekit:
    ports: !override
      - "127.0.0.1:${KYMATRIX_ACCEPT_TCP_PORT:?}:${KYMATRIX_ACCEPT_TCP_PORT:?}/tcp"
      - "127.0.0.1:${KYMATRIX_ACCEPT_UDP_PORT:?}:${KYMATRIX_ACCEPT_UDP_PORT:?}/udp"

      - "127.0.0.1:${KYMATRIX_ACCEPT_TURN_PORT:?}:5349/tcp"
      - "127.0.0.1:3478:3478/udp"
      - "127.0.0.1:30000-30100:30000-30100/udp"

  mas:
    volumes:
      - ./tls/ca.crt:/etc/ssl/certs/ca-certificates.crt:ro

  # A third config file, test-only: federation trusts the throwaway CA, and the federation step
  # appends the proxy's private address to ip_range_whitelist. The shipped files set neither.
  synapse:
    command: ["run", "--config-path", "/config/homeserver.yaml", "--config-path", "/federation.yaml", "--config-path", "/accept-federation.yaml"]
    volumes:
      - ./overrides/synapse-federation.yaml:/accept-federation.yaml:ro
      - ./tls/ca.crt:/accept-ca.crt:ro

  # The federation step's peer homeserver: the pinned Synapse, SQLite in tmpfs, started only
  # by that step.
  peer:
    image: ghcr.io/element-hq/synapse:v1.162.0@sha256:6b84a7bbac36f080b2d2e51e0289cf1b08b349598ea44a558df38d558f2c2311
    user: "${KY_MATRIX_UID:?}:${KY_MATRIX_GID:?}"
    command: ["run", "--config-path", "/peer.yaml"]
    tmpfs: [/data]
    volumes:
      - ./overrides/peer.yaml:/peer.yaml:ro
      - ./tls/ca.crt:/accept-ca.crt:ro

networks:
  default:
    name: ${KY_NETWORK:?}
