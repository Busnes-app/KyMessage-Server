# Harness TLS proxy: one throwaway certificate for the four https hosts.
ssl_certificate     /etc/nginx/tls/leaf.crt;
ssl_certificate_key /etc/nginx/tls/leaf.key;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;

server {
  listen 443 ssl;
  server_name id.kymatrix.test;
  location / { proxy_pass http://kyidentity:5867; }
}
server {
  listen 443 ssl;
  server_name auth.kymatrix.test;
  location / { proxy_pass http://mas:8080; }
}
server {
  listen 443 ssl;
  server_name matrix.kymatrix.test;
  client_max_body_size 50M;
  include /etc/nginx/kymatrix-extra/*.conf;
  location / { proxy_pass http://synapse:8008; }
}
server {
  listen 443 ssl;
  server_name chat.kymatrix.test;
  location / { proxy_pass http://element:8080; }
}
