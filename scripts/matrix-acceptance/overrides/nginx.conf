# Harness TLS proxy: one throwaway certificate for the five https hosts.
ssl_certificate     /etc/nginx/tls/leaf.crt;
ssl_certificate_key /etc/nginx/tls/leaf.key;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
# Upstreams are looked up per request (Docker's DNS), so the proxy can start with only
# KyIdentity behind it: MAS cannot start until the client is registered there.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
  listen 443 ssl;
  server_name id.kymatrix.test;
  set $kyid http://kyidentity:5867;
  location / { proxy_pass $kyid; }
}
server {
  listen 443 ssl;
  server_name auth.kymatrix.test;
  set $mas http://mas:8080;
  location / { proxy_pass $mas; }
}
server {
  listen 443 ssl;
  server_name matrix.kymatrix.test;
  client_max_body_size 50M;
  include /etc/nginx/kymatrix-extra/*.conf;
  set $synapse http://synapse:8008;
  location / { proxy_pass $synapse; }
}
server {
  listen 443 ssl;
  server_name chat.kymatrix.test;
  set $element http://element:8080;
  location / { proxy_pass $element; }
}
server {
  listen 443 ssl;
  server_name admin.kymatrix.test;
  set $app http://app:8080;
  location / { proxy_pass $app; }
}

server {
  listen 443 ssl;
  server_name sfu.kymatrix.test;
  set $livekit http://livekit:7880;
  location ^~ /twirp/ { return 404; }
  location / {
    proxy_pass $livekit;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 1h;
  }
}
