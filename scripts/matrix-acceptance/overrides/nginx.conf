# Harness TLS proxy: one throwaway certificate (kymatrix.test and *.kymatrix.test) for every https host.
ssl_certificate     /etc/nginx/tls/leaf.crt;
ssl_certificate_key /etc/nginx/tls/leaf.key;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
# Upstreams are looked up per request (Docker's DNS), so the proxy can start with only
# KyIdentity behind it: MAS cannot start until the client is registered there.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
  listen 443 ssl;
  server_name id.kymatrix.test;
  set $kyid http://kyidentity:5867;
  location / { proxy_pass $kyid; }
}
server {
  listen 443 ssl;
  server_name auth.kymatrix.test;
  set $mas http://mas:8080;
  location / { proxy_pass $mas; }
}
server {
  listen 443 ssl;
  server_name matrix.kymatrix.test;
  client_max_body_size 50M;
  include /etc/nginx/kymatrix-extra/*.conf;
  set $synapse http://synapse:8008;
  location / { proxy_pass $synapse; }
}
# The server name: discovery files only, from the app, as docs/Reverse_Proxy_Networking.md routes it.
server {
  listen 443 ssl;
  server_name kymatrix.test;
  set $app http://app:8080;
  location ~ ^/\.well-known/matrix/(client|server)$ { proxy_pass $app; }
  location / { return 404; }
}
# The federation step's peer homeserver, delegated to itself on 443.
server {
  listen 443 ssl;
  server_name peer.kymatrix.test;
  set $peer http://peer:8008;
  location = /.well-known/matrix/server {
    default_type application/json;
    return 200 '{"m.server":"peer.kymatrix.test:443"}';
  }
  location / { proxy_pass $peer; }
}
server {
  listen 443 ssl;
  server_name chat.kymatrix.test;
  set $element http://element:8080;
  location / { proxy_pass $element; }
}
# KyCalendar, only where the harness runs one (KYCALENDAR_SRC).
server {
  listen 443 ssl;
  server_name cal.kymatrix.test;
  set $kycalendar http://kycalendar:8080;
  location / { proxy_pass $kycalendar; }
}
# KyPost stand-in, only where the harness runs KyCalendar: it records each message KyCalendar
# hands KyPost to mail (headers and body, read back by kypost-sink.py) and answers as KyPost
# does. It mails nothing.
log_format kypost_sink escape=json '{"type":"$http_x_kysignon_event_type","id":"$http_x_kysignon_event_id",'
  '"ts":"$http_x_kysignon_timestamp","sig":"$http_x_kysignon_signature","body":"$request_body"}';
server {
  listen 443 ssl;
  server_name post.kymatrix.test;
  # The body stays in memory, so $request_body holds it.
  client_max_body_size 1m;
  client_body_buffer_size 1m;
  location = /api/calendar/itip/send {
    access_log /var/log/kypost-sink/sent.jsonl kypost_sink;
    proxy_pass http://127.0.0.1:8099;
  }
  location / { return 404; }
}
server {
  listen 127.0.0.1:8099;
  access_log off;
  default_type application/json;
  location / { return 200 '{}'; }
}
server {
  listen 443 ssl;
  server_name admin.kymatrix.test;
  set $app http://app:8080;
  location / { proxy_pass $app; }
}

server {
  listen 443 ssl;
  server_name sfu.kymatrix.test;
  set $livekit http://livekit:7880;
  location ^~ /twirp/ { return 404; }
  location / {
    proxy_pass $livekit;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 1h;
  }
}
