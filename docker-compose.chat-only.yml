# Chat without calls: append after docker-compose.matrix.yml and set KY_MATRIX_CALLS=off in .env
# (Compose needs that to drop the RTC host and media bind IP requirements). `up -d` runs no
# LiveKit and publishes no port; KyMessages serves no RTC route or call discovery and Health
# lists LiveKit as not deployed. matrix-init with KY_MATRIX_CALLS=off turns calls off in
# Synapse and Element. Not with docker-compose.turn.yml or docker-compose.notes.yml (calls only).
services:
  livekit:
    # Zero containers, not a profile: Compose ignores a service outside the active profiles,
    # even with --remove-orphans, so a LiveKit left from calls on kept running, publishing its
    # media ports, with KyMessages' call reconciler off. At scale 0 `docker compose up -d`
    # stops and removes it, ending calls in progress.
    scale: 0
    ports: !reset []
  app:
    environment:
      - KY_MATRIX_CALLS=off
