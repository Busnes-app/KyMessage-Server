name: Suite meetings

# KyCalendar video meetings, chat and meeting guests against a real KyMessages stack:
# scripts/matrix-acceptance.sh with KYCALENDAR_SRC, steps suite-meetings, suite-chat and
# suite-guests (docs/KYCALENDAR.md, docs/SUITE-CHAT.md). KyPost is a stand-in on the harness
# proxy that records what KyCalendar hands it to mail. KyCalendar and KyIdentity are built
# from their main branches, unpinned, so this is not part of ci.yml: a change in either repo
# must not fail this repo's pull requests or block a release. It runs nightly, on demand, and on
# pull requests that touch the meeting code or the harness. The peers' refs are fixed and their
# builds write no cache, so nothing another repository's branch builds is reused here.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/suite-meetings.yml
      - scripts/matrix-acceptance.sh
      - scripts/matrix-acceptance/**
      - internal/kycalendar/**
      - internal/api/meeting_handlers*.go
      - internal/api/kycalendar_link*.go
      - internal/api/suite_chat*.go
      - internal/api/suite_pair*.go
      - internal/api/guest_handlers*.go
      - web/src/pages/Meet.tsx
      - internal/synapseadmin/meetings*.go

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "26"

jobs:
  suite-meetings:
    name: KyCalendar meetings on a real KyMessages stack
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    # Stack set-up and prove take about 8 minutes, the suite steps about 10.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Busnes-app/KyIdentity-server
          ref: master
          path: kyidentity-src
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Busnes-app/KyCalendar
          ref: main
          path: kycalendar-src
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: scripts/matrix-acceptance/package-lock.json
      - id: playwright
        run: echo "version=$(jq -r '.packages["node_modules/playwright"].version' scripts/matrix-acceptance/package-lock.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - run: npx --yes "playwright@${{ steps.playwright.outputs.version }}" install --with-deps chromium
        working-directory: scripts/matrix-acceptance
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: kymatrix-accept-app:ci
          cache-from: type=gha,scope=kymessages
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: kyidentity-src
          load: true
          tags: kymatrix-accept-kyidentity:ci
          cache-from: type=gha,scope=kyidentity
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: kycalendar-src
          load: true
          tags: kymatrix-accept-kycalendar:ci
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: notes
          load: true
          tags: kymatrix-accept-notes:ci
          cache-from: type=gha,scope=kymessages-notes
      - name: TURN TLS certificate tools
        run: sudo apt-get update && sudo apt-get install -y libnss3-tools
      - name: Suite meetings
        env:
          KYIDENTITY_SRC: ${{ github.workspace }}/kyidentity-src
          KYCALENDAR_SRC: ${{ github.workspace }}/kycalendar-src
          MATRIX_ACCEPT_PREBUILT: "1"
          MATRIX_ACCEPT_STOP_AFTER: suite-guests
          # The guest steps run in ci.yml's meeting-guests leg.
          MATRIX_ACCEPT_SKIP: guest-spikes guests
          MATRIX_ACCEPT_ARTIFACTS: ${{ runner.temp }}/matrix-acceptance
        run: bash scripts/matrix-acceptance.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: suite-meetings-evidence
          path: ${{ runner.temp }}/matrix-acceptance/*/evidence/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: suite-meetings-traces
          path: ${{ runner.temp }}/matrix-acceptance/
          retention-days: 7
