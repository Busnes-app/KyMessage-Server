name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A superseded pull request run cancels. Every other run gets its own group, so no master
# run is ever cancelled, running or pending.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "26"

jobs:
  go-default:
    name: Go SQLite (default)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: Proxy compose overlay
        run: bash scripts/check-compose-proxy.sh

      - name: Matrix compose overlay
        run: bash scripts/check-compose-matrix.sh

      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - run: go mod verify
      - run: go vet ./...
      # The release binary must not depend on where it is built: build it the way the
      # Dockerfile does (no .git in the context, -trimpath) from two directories and require
      # identical bytes. It embeds the committed web/dist, which the web job proves is what
      # the Dockerfile's frontend stage rebuilds. docs/VERIFYING-RELEASES.md tells users how
      # to repeat this against a release image.
      - name: release binary is repeatable
        run: |
          set -euo pipefail
          ld="-s -w -X github.com/Busnes-app/ky_server_base/internal/appversion.release=0.0.0"
          for d in "$RUNNER_TEMP/a" "$RUNNER_TEMP/elsewhere/b"; do
            mkdir -p "$d/src"
            git archive HEAD | tar -x -C "$d/src"
            (cd "$d/src" && CGO_ENABLED=0 GOOS=linux go build -trimpath -ldflags="$ld" -o "$d/kymessages" ./cmd/server)
          done
          sha256sum "$RUNNER_TEMP/a/kymessages" "$RUNNER_TEMP/elsewhere/b/kymessages"
          cmp "$RUNNER_TEMP/a/kymessages" "$RUNNER_TEMP/elsewhere/b/kymessages"
      - run: go build ./...

      - name: Tests with race detector and coverage
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Strong-key overlay preserves Compose configuration
        run: python3 docs/check-strong-crypto-compose.py

      - name: Coverage summary
        run: |
          go tool cover -func=coverage.out | tail -n 1 | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out

  go-strong-key:
    name: Go SQLite (strong-key profile, fuzzing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # docs/STRONG-CRYPTO.md: the whole suite again under the supported strong-key profile.
      - name: Tests under the strong-key profile
        env:
          GODEBUG: fips140=on
        run: go test -race -count=1 ./...

      # Bounded fuzzing, roughly 10-20 s per target. Minimising a new input may take the
      # default 60 s and stalls the exec count meanwhile, so it is capped at 5 s.
      - run: go test -fuzz=FuzzClientIP -fuzztime=200000x -fuzzminimizetime=5s ./internal/auth
      - run: go test -fuzz=FuzzParseTrustedProxies -fuzztime=600000x -fuzzminimizetime=5s ./internal/config
      - run: go test -fuzz=FuzzSetBrand -fuzztime=400000x -fuzzminimizetime=5s ./internal/branding
      - run: go test -fuzz=FuzzDecodeIndex -fuzztime=800000x -fuzzminimizetime=5s ./internal/backup/media

  # The required SQLite check: green only when both legs are.
  go:
    name: Go build, vet & tests (SQLite)
    needs: [go-default, go-strong-key]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}" = true

  postgres:
    name: Go tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Same suite, real Postgres: each test gets its own schema (internal/testdb).
      - name: Tests against PostgreSQL
        env:
          KY_TEST_POSTGRES_DSN: postgres://ci:ci@127.0.0.1:5432/ci_test?sslmode=disable
        run: go test -race -count=1 ./...

  web:
    name: Frontend typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - name: Tests
        run: npm test
        working-directory: web

      - name: Typecheck and build
        run: npm run build
        working-directory: web

      # web/dist is embedded into the Go binary, so a stale commit ships a stale UI. Status, not
      # diff: a new hashed bundle is an untracked file, which git diff never reports.
      - name: Committed web/dist matches source
        run: |
          dirty="$(git status --porcelain -- web/dist)"
          if [ -n "$dirty" ]; then printf '%s\n' "$dirty"; exit 1; fi

      - name: npm audit
        run: npm audit --audit-level=high
        working-directory: web

  browser:
    name: Browser regressions (production server)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: go build -o .browser/server ./cmd/server
      - id: playwright
        run: echo "version=$(jq -r '.packages["node_modules/playwright"].version' web/package-lock.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-firefox
      # Still run on a cache hit: --with-deps installs the system libraries.
      - run: npx playwright install --with-deps chromium firefox
        working-directory: web
      - run: npm run test:browser
        working-directory: web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-results
          path: web/test-results/
          retention-days: 7

  # Two halves of scripts/matrix-acceptance.sh in parallel. Both set the stack up and run
  # prove and console; every other step runs in exactly one of them.
  matrix-acceptance-legs:
    name: Matrix acceptance (${{ matrix.part }})
    runs-on: ubuntu-latest
    # Measured locally: 434s (backup, restore and console rooms included); headroom for slower runners and image pulls.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: offboarding, backup and restore
            skip: notes agents
            stop-after: ""
          - part: notes and agents
            skip: closed offboard-cut offboard-reactivate offboard-delete offboard-delete-locked offboard-unassign offboard-sweep offboard-missed admin-isolation
            stop-after: agents
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The throwaway KyIdentity, built from source with its own Dockerfile. Pinned so a
      # KyIdentity change cannot break this repo's CI unannounced; bump deliberately.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Busnes-app/KyIdentity-server
          ref: 8cf7cf9f424e14eaf9d7bea8e822af904f779528
          path: kyidentity-src
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: scripts/matrix-acceptance/package-lock.json
      - id: playwright
        run: echo "version=$(jq -r '.packages["node_modules/playwright"].version' scripts/matrix-acceptance/package-lock.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      # The script runs npm ci itself; install the browser for the version its lockfile pins.
      # Still run on a cache hit: --with-deps installs the system libraries.
      - run: npx --yes "playwright@${{ steps.playwright.outputs.version }}" install --with-deps chromium
        working-directory: scripts/matrix-acceptance
      # The script's three images, from the same sources, through the layer cache. Only the
      # first leg writes it; release-image.yml never reads it.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: kymatrix-accept-app:ci
          cache-from: type=gha,scope=kymessages
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: kyidentity-src
          load: true
          tags: kymatrix-accept-kyidentity:ci
          cache-from: type=gha,scope=kyidentity
          cache-to: ${{ matrix.stop-after == '' && 'type=gha,scope=kyidentity,mode=max' || '' }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: notes
          load: true
          tags: kymatrix-accept-notes:ci
          cache-from: type=gha,scope=kymessages-notes
      - name: TURN TLS certificate tools
        run: sudo apt-get update && sudo apt-get install -y libnss3-tools
      - name: Matrix acceptance
        env:
          KYIDENTITY_SRC: ${{ github.workspace }}/kyidentity-src
          MATRIX_ACCEPT_REPRODUCE: "1"
          MATRIX_ACCEPT_PREBUILT: "1"
          MATRIX_ACCEPT_SKIP: ${{ matrix.skip }}
          MATRIX_ACCEPT_STOP_AFTER: ${{ matrix.stop-after }}
          MATRIX_ACCEPT_ARTIFACTS: ${{ runner.temp }}/matrix-acceptance
        run: bash scripts/matrix-acceptance.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: matrix-acceptance-traces-${{ strategy.job-index }}
          path: ${{ runner.temp }}/matrix-acceptance/
          retention-days: 7

  # The required check: green only when both halves are.
  matrix-acceptance:
    name: Matrix acceptance (encrypted storage, closed server)
    needs: matrix-acceptance-legs
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}" = true

  security:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  smoke:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - run: shellcheck scripts/*.sh scripts/matrix-acceptance/*.sh
      - run: go build -o kymessages ./cmd/server
      - run: scripts/smoke-test.sh
      - run: python3 scripts/backup-acceptance.py

  docker:
    name: Docker image build & run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: kymessages:ci
          cache-from: type=gha,scope=kymessages
          cache-to: type=gha,scope=kymessages,mode=max

      - name: Container serves the app
        run: |
          docker run -d --name ky_ci -p 18080:8080 \
            -e KY_ADMIN_PASSWORD='CiSmokeAdminPass123!' \
            -e KY_CAPTCHA_PROVIDER=none \
            kymessages:ci
          trap 'docker logs ky_ci; docker rm -f ky_ci' EXIT

          curl -sf -o /dev/null --retry 30 --retry-delay 1 --retry-all-errors http://127.0.0.1:18080/
          curl -sf -o /dev/null http://127.0.0.1:18080/api/settings
          curl -sf -X POST -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"CiSmokeAdminPass123!"}' \
            http://127.0.0.1:18080/api/auth/login | grep -q '"authenticated":true'

  notes:
    name: Meeting-notes bot (tests & image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: notes/package-lock.json

      - run: npm ci --ignore-scripts
        working-directory: notes

      - name: Unit tests
        run: npm test
        working-directory: notes

      - name: npm audit
        run: npm audit --omit=dev --audit-level=high
        working-directory: notes

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: notes
          load: true
          tags: kymessages-notes:ci
          cache-from: type=gha,scope=kymessages-notes
          cache-to: type=gha,scope=kymessages-notes,mode=max

      # As shipped: offline, read-only, no capability. Kokoro must speak the notice and Whisper
      # in the same image must hear it back from the baked models.
      - name: Image speaks and hears offline
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            -v "$PWD/notes/test:/t:ro" -v "$RUNNER_TEMP:/in" --user "$(id -u):$(id -g)" kymessages-notes:ci \
            sh -c 'node /t/say.mjs "This meeting is being recorded for note taking." /in/n.wav && node /t/hear.mjs /in/n.wav "This meeting is being recorded for note taking."'
